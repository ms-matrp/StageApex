<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приёмка и определение коробок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Переключатель режима -->
    <div class="nav-tabs">
        <button id="tabWorkerBtn" class="tab-btn active">Сотрудник (Приёмка)</button>
        <button id="tabManagerBtn" class="tab-btn">Менеджер (Нужно определить)</button>
    </div>

    <!-- 1) ИНТЕРФЕЙС СОТРУДНИКА (Только загрузка) -->
    <div id="workerSection">
        <h1>Приёмка коробки</h1>

        <div class="card">
            <div class="status">
                Статус: <span id="status">Ожидание</span>
            </div>

            <div class="number">
                <div class="title">Номер коробки</div>
                <div id="boxNumber">----</div>
            </div>

            <button id="createBtn">Принять коробку</button>
        </div>

        <div class="card" id="uploadBlock" style="display: none;">
            <h2>Фотографии</h2>

            <label>
                Фото коробки
                <input type="file" id="photo1" accept="image/*" capture="environment">
            </label>

            <label>
                Фото содержимого
                <input type="file" id="photo2" accept="image/*" capture="environment">
            </label>

            <label>
                Фото документов
                <input type="file" id="photo3" accept="image/*" capture="environment">
            </label>

            <button id="finishBtn">Завершить</button>
        </div>
    </div>

    <!-- 2) ИНТЕРФЕЙС МЕНЕДЖЕРА (Только список со статусом "На определении") -->
    <div id="managerSection" style="display: none;">
        <h1>Нужно определить</h1>
        <button id="refreshManagerBtn" class="refresh-btn">🔄 Обновить список</button>

        <div id="boxesList">
            <!-- Сюда JS подгрузит только неразобранные коробки -->
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
